services:
  - type: web
    name: novagpt
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix Backend
    startCommand: npm start --prefix Backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
